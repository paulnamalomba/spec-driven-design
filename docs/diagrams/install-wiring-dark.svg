  <rect x="295.7145" y="40" width="197.55999999999997" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="394.49449999999996" y="58.45" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Symlink into agent skills dir</text>
</g>
<g class="node" data-id="PLG" data-label="my-plugins, external-plugins" data-shape="rectangle">
  <rect x="40" y="100.9" width="205.71099999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="142.8555" y="119.35000000000001" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">my-plugins, external-plugins</text>
</g>
<g class="node" data-id="MKT" data-label="Add marketplace, install plugin" data-shape="rectangle">
  <rect x="295.7145" y="100.9" width="217.56699999999995" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="404.49799999999993" y="119.35000000000001" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Add marketplace, install plugin</text>
</g>
