  <rect x="543.2779999999999" y="70.45" width="229.42299999999992" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="657.9894999999999" y="88.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Claude Code, Codex, Antigravity</text>
</g>
</svg>